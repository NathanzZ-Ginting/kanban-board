version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: kanban-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kanban_db
      MYSQL_USER: kanban_user
      MYSQL_PASSWORD: kanban_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kanban-network

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kanban-network

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: kanban-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GO_ENV=development
      - AUTH_SERVICE_PORT=8001
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=kanban_user
      - MYSQL_PASSWORD=kanban_pass
      - MYSQL_DATABASE=kanban_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kanban-network

  # User Service
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: kanban-user-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - GO_ENV=development
      - USER_SERVICE_PORT=8002
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=kanban_user
      - MYSQL_PASSWORD=kanban_pass
      - MYSQL_DATABASE=kanban_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kanban-network

  # Board Service
  board-service:
    build:
      context: ./backend/board-service
      dockerfile: Dockerfile
    container_name: kanban-board-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - GO_ENV=development
      - BOARD_SERVICE_PORT=8003
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=kanban_user
      - MYSQL_PASSWORD=kanban_pass
      - MYSQL_DATABASE=kanban_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kanban-network

  # Task Service
  task-service:
    build:
      context: ./backend/task-service
      dockerfile: Dockerfile
    container_name: kanban-task-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - GO_ENV=development
      - TASK_SERVICE_PORT=8004
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=kanban_user
      - MYSQL_PASSWORD=kanban_pass
      - MYSQL_DATABASE=kanban_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kanban-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: kanban-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8001
      - NEXT_PUBLIC_USER_SERVICE_URL=http://localhost:8002
      - NEXT_PUBLIC_BOARD_SERVICE_URL=http://localhost:8003
      - NEXT_PUBLIC_TASK_SERVICE_URL=http://localhost:8004
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - auth-service
      - user-service
      - board-service
      - task-service
    networks:
      - kanban-network

networks:
  kanban-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
